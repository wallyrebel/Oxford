name: Editorial pipeline tests
on:
  pull_request:
  push:
    branches: [main, improve-editorial-quality]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest -q
