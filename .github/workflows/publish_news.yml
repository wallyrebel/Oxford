name: Oxford News Publisher

on:
  schedule:
    # Frequent checks; quality gates never fill a quota with unsupported stories.
    - cron: '7,22,37,52 * * * *'
  
  # Temporary branch-only verification; removed after the dry run.
  push:
    branches: [fix-publisher-scheduling]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no publishing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      single_feed:
        description: 'Exact feed name, e.g. Oxford News Feed 1; blank checks all feeds'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:
  process-feeds:
    # Materialize jobs before queueing, and keep previews out of the publishing queue.
    concurrency:
      group: oxford-news-${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && 'preview' || 'publisher' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Create data directory
        run: mkdir -p data

      - name: Run publishing safeguards
        run: |
          pip install pytest
          python -m pytest -q

      - name: Restore database from cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}
          restore-keys: |
            processed-db-

      - name: Run RSS to WordPress
        env:
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EXTRACTION_MODEL: ${{ vars.OPENAI_EXTRACTION_MODEL || 'gpt-4.1-nano' }}
          OPENAI_MODEL: ${{ vars.OPENAI_REWRITE_MODEL || 'gpt-5.6-luna' }}
          OPENAI_CHECK_MODEL: ${{ vars.OPENAI_CHECK_MODEL || 'gpt-5.4-mini' }}
          TARGET_MIN_WORDS: ${{ vars.TARGET_MIN_WORDS || '200' }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || github.event.inputs.dry_run || 'false' }}
          SINGLE_FEED: ${{ github.event.inputs.single_feed }}
          
          # WordPress
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          
          # Image providers (optional)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          
          # Logging
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Chicago' }}
          
          # Email notifications (optional)
          SMTP_EMAIL: ${{ github.event_name == 'schedule' && secrets.SMTP_EMAIL || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          ARGS=(--config feeds.yaml)
          
          # Add dry-run flag if specified
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          
          # Add single-feed flag if specified
          if [ -n "$SINGLE_FEED" ]; then
            ARGS+=(--single-feed "$SINGLE_FEED")
          fi
          
          python -m rss_to_wp run "${ARGS[@]}"

      - name: Verify Pexels fallback access without uploading media
        if: github.event_name == 'push'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from rss_to_wp.images.pexels import PexelsClient
          key = os.environ.get('PEXELS_API_KEY')
          assert key, 'Pexels key missing'
          image = PexelsClient(key).search('community park', per_page=1)
          assert image and image.get('url'), 'Pexels search failed'
          print('Pexels authenticated search succeeded; no media uploaded or article published.')
          PY

      - name: Save database to cache
        if: always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}

      - name: Preserve database recovery copy
        if: always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oxford-publishing-state-${{ github.run_id }}
          path: data/processed.db
          retention-days: 30

      - name: Summary
        if: always()
        env:
          SUMMARY_DRY_RUN: ${{ github.event_name == 'push' && 'true' || github.event.inputs.dry_run || 'false' }}
          SUMMARY_SINGLE_FEED: ${{ github.event.inputs.single_feed || 'All feeds' }}
        run: |
          echo "## RSS to WordPress Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "- **Dry Run**: $SUMMARY_DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Single Feed**: $SUMMARY_SINGLE_FEED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/processed.db ]; then
            COUNT=$(sqlite3 data/processed.db "SELECT COUNT(*) FROM processed_entries;" 2>/dev/null || echo "N/A")
            echo "- **Total Processed Entries**: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
