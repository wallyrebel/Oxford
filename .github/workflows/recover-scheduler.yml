name: Recover Oxford publishing scheduler

# One-time maintenance, isolated from the publishing concurrency group.
# This branch-only workflow is not intended to be merged into main.
on:
  push:
    branches: [fix-scheduler-recovery]
    paths: [.github/workflows/recover-scheduler.yml]

permissions:
  actions: write

jobs:
  recover:
    if: github.repository == 'wallyrebel/Oxford'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch an Oxford test through the supported API
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = {owner: 'wallyrebel', repo: 'Oxford', workflow_id: 224281230};
            const {data: state} = await github.rest.actions.getWorkflow(workflow);
            if (state.state !== 'active') throw new Error('Publisher is not active');
            const result = await github.rest.actions.createWorkflowDispatch({
              ...workflow, ref: 'main', inputs: {dry_run: 'true', single_feed: 'OxfordNewsFeed1'}
            });
            core.info(`Dispatch HTTP ${result.status}`);
            await core.summary.addRaw(JSON.stringify(result.data) + '\n', true).write();
